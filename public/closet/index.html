<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Your closet · oro</title>
  <link rel="stylesheet" href="/closet/closet.css">
  <script type="module" src="/closet/closet.js"></script>
</head>
<body>
  <main>
    <header class="page-header">
      <h1 tabindex="-1">Closet</h1>
      <p id="status" role="status">Opening your closet…</p>
    </header>
    <div class="toolbar">
      <label class="search-field">Search your clothes<input id="search" type="search" placeholder="Try linen, blue, or sneakers" maxlength="200"></label>
      <details id="filters">
        <summary aria-label="Filter clothes">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M3 5h10m4 0h4M3 12h3m4 0h11M3 19h13m4 0h1M16 2v6M7 9v6m10 1v6"/></svg>
        </summary>
        <div class="filter-dropdown">
          <fieldset id="color">
            <legend>Color</legend>
            <div id="color-options"><label><input type="radio" name="color" value="" checked>All colors</label></div>
          </fieldset>
        </div>
      </details>
    </div>
    <div class="categories" id="categories" role="group" aria-label="Clothing categories"></div>
    <div id="grid" class="grid"></div>
  </main>
  <dialog id="item-dialog" aria-labelledby="item-heading">
    <button id="close-item" class="icon-button" type="button" aria-label="Close item" autofocus>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg>
    </button>
    <div id="item-photo"></div>
    <h2 id="item-title-display">
      <button id="edit-title" type="button" aria-describedby="edit-title-hint">
        <span id="item-heading"></span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="m16 3 5 5L8 21H3v-5ZM14 5l5 5"/></svg>
      </button>
      <span id="edit-title-hint" hidden>Edit title</span>
    </h2>
    <form id="edit-item" hidden>
      <label for="item-title">Title (required)</label>
      <input id="item-title" name="title" required maxlength="200" aria-describedby="item-status">
      <button type="submit">Save title</button>
      <button id="cancel-edit" type="button">Cancel</button>
    </form>
    <dl id="item-details"></dl>
    <button id="delete-item" class="icon-button" type="button" aria-label="Delete item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>
    </button>
    <div id="delete-confirmation" hidden>
      <p>Delete this item from your closet? This cannot be undone here.</p>
      <button id="cancel-delete" type="button">Keep item</button>
      <button id="confirm-delete" type="button">Delete permanently</button>
    </div>
    <p id="item-status" role="status"></p>
  </dialog>
</body>
</html>
