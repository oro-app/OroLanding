<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Your closet · oro</title>
  <link rel="stylesheet" href="/closet/closet.css">
  <script type="module" src="/closet/closet.js"></script>
</head>
<body>
  <main>
    <header class="tabs">
      <h1 tabindex="-1">Closet</h1>
      <button type="button" disabled aria-label="Wishlist (unavailable in shared closets)">Wishlist</button>
    </header>
    <div class="toolbar">
      <div class="summary">
        <p class="order">Your items</p>
        <p id="status" role="status">Opening your closet…</p>
      </div>
      <button class="icon-button" type="button" data-search aria-label="Search clothes" aria-expanded="false" aria-controls="controls">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="8"/><path d="m16.5 16.5 5 5"/></svg>
      </button>
      <button class="icon-button" id="filters" type="button" aria-label="Filter clothes" aria-expanded="false" aria-controls="controls">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h10m4 0h4M3 12h3m4 0h11M3 19h13m4 0h1M16 2v6M7 9v6m10 1v6"/></svg>
      </button>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <div class="controls" id="controls" hidden>
      <label class="search-field">Search your clothes<input id="search" type="search" placeholder="Try linen, blue, or sneakers" maxlength="200"></label>
      <label>Category<select id="category"><option value="">All categories</option></select></label>
      <label>Color<select id="color"><option value="">All colors</option></select></label>
    </div>
    <div class="categories" id="categories" role="group" aria-label="Clothing categories"></div>
    <div id="grid" class="grid"></div>
    <p class="privacy">Add clothes by texting a photo to oro. Anyone with this link can view this closet until it expires.</p>
    <p id="expiry" class="privacy"></p>
  </main>
  <div class="bottom-bar">
    <nav class="dock" aria-label="Closet navigation">
      <a href="/" aria-label="Oro home"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m2 10 10-8 10 8v12h-7v-8H9v8H2Z"/></svg></a>
      <button type="button" id="show-closet" aria-current="page" aria-label="Closet"><svg class="shirt" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m8 3-6 3v6h4v10h12V12h4V6l-6-3c0 4-8 4-8 0Z"/></svg></button>
      <button type="button" data-search aria-label="Search clothes" aria-expanded="false" aria-controls="controls"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="8"/><path d="m16.5 16.5 5 5M10.5 6a4.5 4.5 0 0 1 4.5 4.5"/></svg></button>
    </nav>
    <a class="add" href="sms:+18556762419" aria-label="Add clothes by texting oro"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v18M3 12h18"/></svg></a>
  </div>
</body>
</html>
