<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Your closet · oro</title>
  <link rel="stylesheet" href="/closet/closet.css">
  <script type="module" src="/closet/closet.js"></script>
</head>
<body>
  <main>
    <header><a href="/" class="brand" aria-label="Oro home">oro</a><a class="add" href="sms:+18556762419">+ Add clothes</a></header>
    <p class="eyebrow">YOUR WARDROBE</p>
    <h1>Your closet,<br>all in one place.</h1>
    <p class="intro">The pieces you've shared with oro. Add something new by texting a photo.</p>
    <p class="privacy">Anyone with this link can view this closet until it expires.</p>
    <div class="controls">
      <label>Search your clothes<input id="search" type="search" placeholder="Try linen, blue, or sneakers" maxlength="200"></label>
      <label>Category<select id="category"><option value="">All categories</option></select></label>
      <label>Color<select id="color"><option value="">All colors</option></select></label>
    </div>
    <div class="summary"><p id="status" role="status" aria-live="polite">Opening your closet…</p><button id="refresh" type="button">Refresh</button></div>
    <div id="grid" class="grid"></div>
    <p id="expiry" class="privacy"></p>
  </main>
</body>
</html>
