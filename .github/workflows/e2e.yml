name: e2e

# Vercel's GitHub integration emits deployment_status events for every
# preview (PR) and production deployment. We run Playwright against the
# deployed URL — full suite for previews, @smoke subset for production.
on:
  deployment_status:

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm only — pnpm-lock.yaml is stale (see CLAUDE.md lockfile footgun).
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ "${{ github.event.deployment_status.environment }}" = "Production" ]; then
            npm run e2e:smoke
          else
            npm run e2e
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
